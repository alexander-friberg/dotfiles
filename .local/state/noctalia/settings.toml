config_version = 14

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.0
    border = "on_hover"
    capsule = true
    capsule_border = "on_primary"
    capsule_foreground = "on_surface"
    capsule_opacity = 0.82999998144805431
    capsule_radius = 0
    end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
    font_scale = 0.78999998979270458
    font_weight = 700
    margin_ends = 0
    radius = 0
    shadow = false
    start = [ "workspaces" ]

[control_center]
width = 840

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "wallpaper"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
icon_size = 39

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 576.0
    cy = 466.0
    output = "eDP-1"
    placement_height = 648.0
    placement_width = 1152.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 8000
temperature_night = 5600

[plugins]
enabled = [ "tmelik/system-monitor", "8bury/mini-docker", "oldirtty/color_picker" ]

[shell]
corner_radius_scale = 0.0
font_family = "JetBrainsMono NF"

    [shell.animation]
    speed = 2.6500000394880772

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"

[theme]
builtin = "Catppuccin"
community_palette = "Kemuri Susu"
shell_mode = "light"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "qt" ]

[wallpaper]
directory = "/home/alex/wps"

    [wallpaper.default]
    path = "/home/alex/wps/AsianHills.jpg"

    [wallpaper.last]
    path = "/home/alex/wps/AsianHills.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/alex/wps/AsianHills.jpg"

[widget.clock]
font_weight = 700
scale = 1.45

[widget.mini-docker]
type = "8bury/mini-docker:mini-docker"

[widget.summary]
anchor = true
show_cpu_temperature = false
show_disk = false
show_gpu_temperature = "off"
show_gpu_usage = "off"
show_gpu_vram = "off"
type = "tmelik/system-monitor:summary"

[widget.workspaces]
active_pill_size = 1.0
empty_color = "on_primary"
occupied_color = "outline"