# --- Prefix ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Basic sanity ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:Tc"
set -g allow-passthrough on

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Splits ---
bind v split-window -h -c "#{pane_current_path}"   # side-by-side
bind s split-window -v -c "#{pane_current_path}"   # stacked

# --- New window keeps cwd ---
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation: prefix + hjkl ---
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- Resize panes: ctrl+meta+hjkl ---
bind -n C-M-h resize-pane -L 5
bind -n C-M-j resize-pane -D 5
bind -n C-M-k resize-pane -U 5
bind -n C-M-l resize-pane -R 5

# --- Session navigation: shift+meta h/l for next/previous ---
bind -n M-H switch-client -p
bind -n M-L switch-client -n

bind -n M-J previous-window
bind -n M-K next-window

# --- New session via popup, prompting for a name ---
bind -n M-n display-popup -w 50 -h 3 -T ' New Session ' -E 'read "name?Session name: " && [ -n "$name" ] && tmux new-session -d -s "$name" && tmux switch-client -t "$name"'

# --- Session switcher via fzf popup ---
bind -n M-s display-popup -w 60 -h 20 -T ' Sessions ' -E 'tmux list-sessions -F "#{session_name}" | fzf --reverse --header "Switch to session:" | xargs -r tmux switch-client -t'

# =========================================================
# prefix + Space -> vi copy-mode for selecting/yanking
# =========================================================
setw -g mode-keys vi
bind Space copy-mode

bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel

# =========================================================
# Status bar: minimal, no background, bracketed elements
# =========================================================
set -g status-style 'bg=default,fg=default'

set -g status-left-length 40
set -g status-left '#[fg=#cba6f7][#S]'

set -g status-right-length 40
set -g status-right '#[fg=#b4befe] ᥈ [#h] #[fg=default][%H:%M]'

set -g status-justify left
setw -g window-status-current-format '[#I:#W]'
setw -g window-status-current-style 'fg=default'
setw -g window-status-format '[#I:#W]'
setw -g window-status-style 'fg=#9E9E9E'
